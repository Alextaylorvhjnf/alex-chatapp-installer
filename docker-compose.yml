version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: chatapp-postgres
    restart: always
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: SynapseDB2024Secure
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatapp


  synapse:
    image: matrixdotorg/synapse:v1.156.0
    container_name: chatapp-synapse
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8008:8008"
      - "8448:8448"
    volumes:
      - ./synapse:/data
    networks:
      - chatapp


  element:
    image: vectorim/element-web:latest
    container_name: chatapp-element
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - chatapp


  coturn:
    image: coturn/coturn:latest
    container_name: chatapp-coturn
    restart: unless-stopped
    network_mode: host  # تغییر این خط
    command:
      - turnserver
      - --listening-ip=45.129.36.41
      - --relay-ip=45.129.36.41
      - --external-ip=45.129.36.41
      - --realm=shikpooshaan.ir
      - --server-name=shikpooshaan.ir
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=6f1e4518d8208cbc2f3e4aba926dee30f13363fd2d6b616922190d31a6d31f2d
      - --fingerprint
      - --no-cli
      - --min-port=49160
      - --max-port=49200


volumes:
  postgres_data:


networks:
  chatapp:
    driver: bridge
